substitutions:
  device_name: bigclock
  friendly_name: "Big Clock"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    # Start the clock display effect after everything is initialised
    priority: -100.0
    then:
      - light.turn_on:
          id: clock_strip
          effect: "Clock Display"
      - light.turn_on:
          id: down_strip
          effect: "Downlight Display"

esp32:
  board: seeed_xiao_esp32c3
  framework:
    type: esp-idf

# ── Logging ───────────────────────────────────────────────────
logger:
  level: WARN
  

# ── OTA ───────────────────────────────────────────────────────
ota:
  - platform: esphome
    password: !secret ota_password

# ── WiFi ──────────────────────────────────────────────────────
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  use_address: 192.168.0.92
  # NONE keeps the radio awake continuously, reducing the burst WiFi
  # interrupts that can corrupt RMT transmission on long LED chains.
  # NOTE: requires a clean power cycle after first OTA flash to take effect.
  power_save_mode: none
  reboot_timeout: 0s
  ap:
    ssid: "${friendly_name} Setup"
    password: !secret fallback_password

captive_portal:

# ── Home Assistant native API ─────────────────────────────────
api:
  encryption:
    key: !secret api_key

# ── Web UI ────────────────────────────────────────────────────
# Accessible at http://bigclock.local after first flash
web_server:
  port: 80

# ── MQTT ──────────────────────────────────────────────────────
# ESPHome publishes MQTT discovery automatically — all entities
# appear in HA via both the native API and MQTT.
#
# ── Display messages ──────────────────────────────────────────
# Publish a JSON payload to  bigclock/display  to show a value
# on the clock for 5 seconds, then it returns to showing the time.
#
# An HA automation can send multiple messages in sequence — each
# one gets 5 seconds. The automation controls pacing by inserting
# a 5 s delay between publishes.
#
# Message format:
#   {
#     "value": 22,              ← integer to display (required)
#     "format": "temp",         ← "temp"   → XX °C  (0–99)
#                                  "number" → XXXX   (0–9999)
#     "color": "#FF6600",       ← hex colour for the value digits (optional, default white)
#     "suffix_color": "#00CCFF" ← hex colour for °C in temp mode  (optional, defaults to color)
#   }
#
# Send value -1 to cancel any active display and return to the clock immediately.
mqtt:
  broker: !secret mqtt_host
  port: 1883
  username: !secret mqtt_user
  password: !secret mqtt_pass
  client_id: ${device_name}
  discovery: false
  birth_message:
    topic: ${device_name}/availability
    payload: "online"
    retain: true
  will_message:
    topic: ${device_name}/availability
    payload: "offline"
    retain: true
  on_message:
    - topic: ${device_name}/display
      then:
        - lambda: |-
            const char* json = x.c_str();

            // Extract an integer field — returns -32767 if key not found
            auto get_int = [](const char* j, const char* key) -> int {
              char search[32];
              snprintf(search, sizeof(search), "\"%s\":", key);
              const char* p = strstr(j, search);
              if (!p) return -32767;
              p += strlen(search);
              while (*p == ' ') p++;
              return atoi(p);
            };

            // Extract a quoted string field into a fixed buffer.
            // Handles optional whitespace after the colon (e.g. "key": "value").
            auto get_str = [](const char* j, const char* key, char* out, int n) -> bool {
              char search[32];
              snprintf(search, sizeof(search), "\"%s\":", key);
              const char* p = strstr(j, search);
              if (!p) return false;
              p += strlen(search);
              while (*p == ' ') p++;  // skip optional whitespace
              if (*p != '"') return false;
              p++;  // skip opening quote
              int i = 0;
              while (*p && *p != '"' && i < n - 1) out[i++] = *p++;
              out[i] = 0;
              return i > 0;
            };

            // Parse a "#RRGGBB" hex colour string into r/g/b components
            auto parse_hex = [](const char* s, int* r, int* g, int* b) -> bool {
              if (!s || s[0] != '#' || strlen(s) != 7) return false;
              long v = strtol(s + 1, nullptr, 16);
              *r = (v >> 16) & 0xFF;
              *g = (v >>  8) & 0xFF;
              *b =  v        & 0xFF;
              return true;
            };

            int val = get_int(json, "value");

            // No "value" field — ignore
            if (val == -32767) return;

            // Negative value = cancel, return to clock immediately
            if (val < 0) {
              id(g_display_until_ms) = 0;
              id(g_dirty) = true;
              return;
            }

            char fmt_buf[16]  = "temp";
            char col_buf[8]   = "#FFFFFF";
            char scol_buf[8]  = "";

            get_str(json, "format",       fmt_buf,  sizeof(fmt_buf));
            get_str(json, "color",        col_buf,  sizeof(col_buf));
            get_str(json, "suffix_color", scol_buf, sizeof(scol_buf));

            // format: "number" → XXXX (0–9999), anything else → XX °C (0–99)
            id(g_display_value)  = val;
            id(g_display_format) = (strncmp(fmt_buf, "number", 6) == 0) ? 2 : 1;

            // Primary colour (white if not provided / invalid)
            int pr = 255, pg = 255, pb = 255;
            parse_hex(col_buf, &pr, &pg, &pb);
            id(g_display_r) = pr;
            id(g_display_g) = pg;
            id(g_display_b) = pb;

            // Suffix colour for °C — falls back to primary colour
            int sr = pr, sg = pg, sb = pb;
            if (scol_buf[0] == '#') parse_hex(scol_buf, &sr, &sg, &sb);
            id(g_display_suffix_r) = sr;
            id(g_display_suffix_g) = sg;
            id(g_display_suffix_b) = sb;

            // Display this value for 5 seconds, then revert to clock
            id(g_display_until_ms) = millis() + 5000;
            id(g_dirty) = true;

# ── Time ──────────────────────────────────────────────────────
# Syncs from HA over the local API — fast, no internet needed.
# Europe/London handles BST/GMT transitions automatically.
time:
  - platform: homeassistant
    id: sntp_time
    timezone: "Europe/London"
    on_time:
      - seconds: 0
        minutes: /1
        then:
          - lambda: id(g_dirty) = true;

# ── Global state ──────────────────────────────────────────────
globals:
  # Hour-digit colour (0–255 per channel).
  # Written by the virtual hour_colour light entity when HA changes colour.
  - id: g_hour_r
    type: int
    restore_value: no
    initial_value: '255'
  - id: g_hour_g
    type: int
    restore_value: no
    initial_value: '0'
  - id: g_hour_b
    type: int
    restore_value: no
    initial_value: '0'

  # Minute-digit colour
  - id: g_min_r
    type: int
    restore_value: no
    initial_value: '0'
  - id: g_min_g
    type: int
    restore_value: no
    initial_value: '255'
  - id: g_min_b
    type: int
    restore_value: no
    initial_value: '0'

  # ── Display overlay state ──────────────────────────────────
  # When millis() < g_display_until_ms the clock shows the overlay
  # value instead of the time. Each MQTT message sets a fresh 5 s window.

  # Timestamp (ms) at which to revert to showing the time
  - id: g_display_until_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  # Value to display
  - id: g_display_value
    type: int
    restore_value: no
    initial_value: '0'

  # Display format: 1 = temp (XX °C, 0–99)  |  2 = number (XXXX, 0–9999)
  - id: g_display_format
    type: int
    restore_value: no
    initial_value: '1'

  # Colour for the value digits
  - id: g_display_r
    type: int
    restore_value: no
    initial_value: '255'
  - id: g_display_g
    type: int
    restore_value: no
    initial_value: '255'
  - id: g_display_b
    type: int
    restore_value: no
    initial_value: '255'

  # Colour for the °C suffix (temp mode only)
  - id: g_display_suffix_r
    type: int
    restore_value: no
    initial_value: '255'
  - id: g_display_suffix_g
    type: int
    restore_value: no
    initial_value: '255'
  - id: g_display_suffix_b
    type: int
    restore_value: no
    initial_value: '255'

  # Set true whenever the display needs redrawing; cleared after each render
  - id: g_dirty
    type: bool
    restore_value: no
    initial_value: 'true'

  # Tracks whether the overlay was active on the last render (for expiry detection)
  - id: g_display_was_active
    type: bool
    restore_value: no
    initial_value: 'false'

  # Auto-brightness from LDR (0.08 = dimmest, 1.0 = full)
  - id: g_brightness
    type: float
    restore_value: no
    initial_value: '1.0'

  # Rainbow mode state (mirrors the switch entity)
  - id: g_rainbow
    type: bool
    restore_value: no
    initial_value: 'false'

  # Downlight colour requested by HA (brightness baked in, 0–255 per channel)
  - id: g_down_r
    type: int
    restore_value: no
    initial_value: '255'
  - id: g_down_g
    type: int
    restore_value: no
    initial_value: '255'
  - id: g_down_b
    type: int
    restore_value: no
    initial_value: '255'

  # ── Preset colour storage ───────────────────────────────────
  # Colours persist across reboots via flash preferences.
  # Preset 1 — Classic (White / White)
  - id: g_p1_hour_r
    type: int
    restore_value: yes
    initial_value: '255'
  - id: g_p1_hour_g
    type: int
    restore_value: yes
    initial_value: '255'
  - id: g_p1_hour_b
    type: int
    restore_value: yes
    initial_value: '255'
  - id: g_p1_min_r
    type: int
    restore_value: yes
    initial_value: '255'
  - id: g_p1_min_g
    type: int
    restore_value: yes
    initial_value: '255'
  - id: g_p1_min_b
    type: int
    restore_value: yes
    initial_value: '255'

  # Preset 2 — Sunset (Orange / Red)
  - id: g_p2_hour_r
    type: int
    restore_value: yes
    initial_value: '255'
  - id: g_p2_hour_g
    type: int
    restore_value: yes
    initial_value: '102'
  - id: g_p2_hour_b
    type: int
    restore_value: yes
    initial_value: '0'
  - id: g_p2_min_r
    type: int
    restore_value: yes
    initial_value: '255'
  - id: g_p2_min_g
    type: int
    restore_value: yes
    initial_value: '0'
  - id: g_p2_min_b
    type: int
    restore_value: yes
    initial_value: '0'

  # Preset 3 — Ocean (Cyan / Blue)
  - id: g_p3_hour_r
    type: int
    restore_value: yes
    initial_value: '0'
  - id: g_p3_hour_g
    type: int
    restore_value: yes
    initial_value: '255'
  - id: g_p3_hour_b
    type: int
    restore_value: yes
    initial_value: '255'
  - id: g_p3_min_r
    type: int
    restore_value: yes
    initial_value: '0'
  - id: g_p3_min_g
    type: int
    restore_value: yes
    initial_value: '102'
  - id: g_p3_min_b
    type: int
    restore_value: yes
    initial_value: '255'

  # Preset 4 — Forest (Green / Lime)
  - id: g_p4_hour_r
    type: int
    restore_value: yes
    initial_value: '0'
  - id: g_p4_hour_g
    type: int
    restore_value: yes
    initial_value: '255'
  - id: g_p4_hour_b
    type: int
    restore_value: yes
    initial_value: '0'
  - id: g_p4_min_r
    type: int
    restore_value: yes
    initial_value: '170'
  - id: g_p4_min_g
    type: int
    restore_value: yes
    initial_value: '255'
  - id: g_p4_min_b
    type: int
    restore_value: yes
    initial_value: '0'

  # Preset 5 — Candy (Pink / Purple)
  - id: g_p5_hour_r
    type: int
    restore_value: yes
    initial_value: '255'
  - id: g_p5_hour_g
    type: int
    restore_value: yes
    initial_value: '0'
  - id: g_p5_hour_b
    type: int
    restore_value: yes
    initial_value: '170'
  - id: g_p5_min_r
    type: int
    restore_value: yes
    initial_value: '170'
  - id: g_p5_min_g
    type: int
    restore_value: yes
    initial_value: '0'
  - id: g_p5_min_b
    type: int
    restore_value: yes
    initial_value: '255'

# ── Light sensor (LDR) ────────────────────────────────────────
# GPIO2 = A0 on XIAO ESP32-C3
# Brighter room → higher ADC voltage → dimmer LEDs (avoids glare)
sensor:
  - platform: adc
    pin: GPIO2
    id: ldr_sensor
    name: "Ambient Light"
    update_interval: 500ms
    attenuation: auto
    filters:
      - sliding_window_moving_average:
          window_size: 8
          send_every: 1
      - delta: 0.05
    on_value:
      then:
        - lambda: |-
            // x = averaged ADC voltage (0.0–3.3 V)
            // Map: dark (0 V) → brightness 1.0, bright (3.3 V) → brightness 0.08
            float br = 1.0f - (x / 3.3f) * 0.92f;
            if (br < 0.08f) br = 0.08f;
            if (br > 1.0f)  br = 1.0f;
            id(g_brightness) = br;
            id(g_dirty) = true;

# ── Virtual outputs for colour storage ────────────────────────
# ESPHome's rgb light platform writes float values (0.0–1.0) to
# these outputs when HA changes the hour or minute colour.
# We store them as 0–255 integers so the rendering lambda can use
# them without driving any physical LEDs directly.
output:
  - platform: template
    id: out_hour_r
    type: float
    write_action:
      - lambda: |-
          id(g_hour_r) = (int)(state * 255.0f);
          id(g_dirty) = true;
  - platform: template
    id: out_hour_g
    type: float
    write_action:
      - lambda: |-
          id(g_hour_g) = (int)(state * 255.0f);
          id(g_dirty) = true;
  - platform: template
    id: out_hour_b
    type: float
    write_action:
      - lambda: |-
          id(g_hour_b) = (int)(state * 255.0f);
          id(g_dirty) = true;

  - platform: template
