# ── Lights ────────────────────────────────────────────────────
light:

  # Virtual RGB light → hour digit colour.
  # HA shows this as a standard colour picker. Changes flow through
  # the template outputs above into the g_hour_r/g/b globals.
  # gamma_correct: 0 — raw sRGB values passed straight to the outputs;
  # the neopixelbus strip handles its own output curve.
  - platform: rgb
    name: "Hour Colour"
    id: hour_colour
    red: out_hour_r
    green: out_hour_g
    blue: out_hour_b
    gamma_correct: 0
    default_transition_length: 0s
    restore_mode: RESTORE_DEFAULT_ON

  # Virtual RGB light → minute digit colour
  - platform: rgb
    name: "Minute Colour"
    id: min_colour
    red: out_min_r
    green: out_min_g
    blue: out_min_b
    gamma_correct: 0
    default_transition_length: 0s
    restore_mode: RESTORE_DEFAULT_ON

  # Physical clock digit strip.
  # Marked internal — HA does not control this directly.
  # All rendering is done by the addressable_lambda effect below.
  # GPIO4 = D3 on XIAO ESP32-C3
  # 252 LEDs = 4 digits × 7 segments × 9 LEDs per segment
  - platform: esp32_rmt_led_strip
    id: clock_strip
    name: "Clock Strip"
    internal: true
    pin: GPIO4
    num_leds: 252
    rgb_order: GRB
    chipset: WS2812
    rmt_symbols: 48
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF
    effects:

      # ── Clock Display ─────────────────────────────────────
      # Polls every 1s to catch overlay expiry; only writes to the
      # LED strip (RMT) when g_dirty is set or the overlay just ended.
      #
      # Default: shows the current local time (HH MM).
      # When a display message has been received via MQTT it shows
      # that value instead until the 5 s window expires, then
      # reverts to the time automatically.
      #
      # Segment pixel layout (63 pixels per digit, 9 per segment):
      #   pixels  0– 8  right-top vertical
      #   pixels  9–17  top horizontal
      #   pixels 18–26  left-top vertical
      #   pixels 27–35  middle horizontal
      #   pixels 36–44  right-bottom vertical
      #   pixels 45–53  left-bottom vertical
      #   pixels 54–62  bottom horizontal
      #
      # Digit pixel bases:
      #   hours tens = 189 | hours units = 126
      #   mins  tens =  63 | mins  units =   0
      - addressable_lambda:
          name: "Clock Display"
          update_interval: 1s
          lambda: |-
            // Only redraw when something has changed
            bool overlay_active = millis() < id(g_display_until_ms);
            bool overlay_just_ended = id(g_display_was_active) && !overlay_active;
            id(g_display_was_active) = overlay_active;
            if (!id(g_dirty) && !overlay_just_ended) return;
            id(g_dirty) = false;

            // Fill pixels [base+start .. base+start+len-1] with colour c
            auto seg = [&](int base, int start, int len, Color c) {
              for (int i = base + start; i < base + start + len; i++) {
                if (i >= 0 && i < 252) it[i] = c;
              }
            };

            // Render one 7-segment character at pixel base with colour c
            // digit 10 = degree symbol °
            // digit 11 = letter C
            auto draw = [&](int digit, int base, Color c) {
              switch (digit) {
                case 0:  seg(base, 0,27,c); seg(base,36,27,c); break;
                case 1:  seg(base, 0, 9,c); seg(base,36, 9,c); break;
                case 2:  seg(base, 0,18,c); seg(base,27, 9,c); seg(base,45,18,c); break;
                case 3:  seg(base, 0,18,c); seg(base,27,27,c); break;
                case 4:  seg(base, 0, 9,c); seg(base,18,27,c); break;
                case 5:  seg(base, 9,45,c); break;
                case 6:  seg(base, 9,54,c); break;
                case 7:  seg(base, 0,18,c); seg(base,36, 9,c); break;
                case 8:  seg(base, 0,63,c); break;
                case 9:  seg(base, 0,45,c); break;
                case 10: // ° degree
                  seg(base, 0,9,c); seg(base, 9,9,c);
                  seg(base,18,9,c); seg(base,27,9,c); break;
                case 11: // C
                  seg(base, 9,9,c); seg(base,18,9,c);
                  seg(base,45,9,c); seg(base,54,9,c); break;
              }
            };

            float br = id(g_brightness);
            it.all() = Color(0, 0, 0);

            if (millis() < id(g_display_until_ms)) {
              // ── Show MQTT overlay value ──────────────────
              Color col_v((uint8_t)(id(g_display_r)        * br),
                          (uint8_t)(id(g_display_g)        * br),
                          (uint8_t)(id(g_display_b)        * br));
              Color col_s((uint8_t)(id(g_display_suffix_r) * br),
                          (uint8_t)(id(g_display_suffix_g) * br),
                          (uint8_t)(id(g_display_suffix_b) * br));
              int val = id(g_display_value);

              if (id(g_display_format) == 2) {
                // Number mode: XXXX  (0–9999)
                int v = val < 0 ? 0 : (val > 9999 ? 9999 : val);
                draw( v / 1000,        189, col_v);
                draw((v /  100) % 10,  126, col_v);
                draw((v /   10) % 10,   63, col_v);
                draw( v         % 10,    0, col_v);
              } else {
                // Temp mode: XX °C  (0–99)
                int v = val < 0 ? 0 : (val > 99 ? 99 : val);
                draw(v / 10, 189, col_v);
                draw(v % 10, 126, col_v);
                draw(10,      63, col_s);  // °
                draw(11,       0, col_s);  // C
              }

            } else {
              // ── Show current local time ──────────────────
              Color col_h((uint8_t)(id(g_hour_r) * br),
                          (uint8_t)(id(g_hour_g) * br),
                          (uint8_t)(id(g_hour_b) * br));
              Color col_m((uint8_t)(id(g_min_r)  * br),
                          (uint8_t)(id(g_min_g)  * br),
                          (uint8_t)(id(g_min_b)  * br));
              auto t = id(sntp_time).now();
              if (t.is_valid()) {
                draw(t.hour   / 10, 189, col_h);
                draw(t.hour   % 10, 126, col_h);
                draw(t.minute / 10,  63, col_m);
                draw(t.minute % 10,   0, col_m);
              }
            }

      # ── Rainbow ───────────────────────────────────────────
      # Sweeps a rainbow wave across all 252 pixels.
      # Toggle via the "Rainbow Mode" switch in HA or MQTT.
      - addressable_rainbow:
          name: "Rainbow"
          speed: 10
          width: 50

  # Physical downlight strip — internal, driven by the Downlight Display effect
  # which applies LDR ambient brightness scaling (g_brightness).
  # GPIO5 = D2 on XIAO ESP32-C3 | 14 LEDs
  - platform: esp32_rmt_led_strip
    id: down_strip
    name: "Downlight Strip"
    internal: true
    pin: GPIO5
    num_leds: 14
    rgb_order: GRB
    chipset: WS2812
    rmt_symbols: 48
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF
    effects:
      - addressable_lambda:
          name: "Downlight Display"
          update_interval: 1s
          lambda: |-
            float br = id(g_brightness);
            it.all() = Color(
              (uint8_t)(id(g_down_r) * br),
              (uint8_t)(id(g_down_g) * br),
              (uint8_t)(id(g_down_b) * br)
            );

  # Virtual RGB light — HA controls colour/brightness through this entity.
  # Values are written into g_down_r/g/b via template outputs;
  # the Downlight Display effect applies LDR scaling (g_brightness) on top.
  - platform: rgb
    name: "Downlight"
    id: down_control
    red: out_down_r
    green: out_down_g
    blue: out_down_b
    gamma_correct: 0
    default_transition_length: 0s
    restore_mode: RESTORE_DEFAULT_ON

  # ── Preset colour picker lights ─────────────────────────────
  # Virtual RGB lights — HA colour pickers for each preset slot.
  # Changing these only updates the stored preset; use the Apply
  # Preset N button to push the colours to the active display.
