# ── Rainbow mode switch ───────────────────────────────────────
switch:
  - platform: template
    name: "Rainbow Mode"
    id: rainbow_switch
    restore_mode: RESTORE_DEFAULT_OFF
    lambda: return id(g_rainbow);
    turn_on_action:
      - globals.set:
          id: g_rainbow
          value: 'true'
      - light.turn_on:
          id: clock_strip
          effect: "Rainbow"
    turn_off_action:
      - globals.set:
          id: g_rainbow
          value: 'false'
      - light.turn_on:
          id: clock_strip
          effect: "Clock Display"

# ── Randomise colours button ──────────────────────────────────
button:
  - platform: template
    name: "Randomise Colours"
    on_press:
      - lambda: |-
          id(g_hour_r) = rand() % 256;
          id(g_hour_g) = rand() % 256;
          id(g_hour_b) = rand() % 256;
          id(g_min_r)  = rand() % 256;
          id(g_min_g)  = rand() % 256;
          id(g_min_b)  = rand() % 256;
          // Sync new values back into the HA light entities
          auto ch = id(hour_colour).turn_on();
          ch.set_rgb(id(g_hour_r)/255.0f, id(g_hour_g)/255.0f, id(g_hour_b)/255.0f);
          ch.perform();
          auto cm = id(min_colour).turn_on();
          cm.set_rgb(id(g_min_r)/255.0f, id(g_min_g)/255.0f, id(g_min_b)/255.0f);
          cm.perform();

  # ── Preset apply buttons ────────────────────────────────────
  - platform: template
    name: "Apply Preset 1"
    on_press:
      - lambda: |-
          id(g_hour_r) = id(g_p1_hour_r); id(g_hour_g) = id(g_p1_hour_g); id(g_hour_b) = id(g_p1_hour_b);
          id(g_min_r)  = id(g_p1_min_r);  id(g_min_g)  = id(g_p1_min_g);  id(g_min_b)  = id(g_p1_min_b);
          id(g_dirty) = true;
          auto ch = id(hour_colour).turn_on();
          ch.set_rgb(id(g_hour_r)/255.0f, id(g_hour_g)/255.0f, id(g_hour_b)/255.0f); ch.perform();
          auto cm = id(min_colour).turn_on();
          cm.set_rgb(id(g_min_r)/255.0f, id(g_min_g)/255.0f, id(g_min_b)/255.0f); cm.perform();

